name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # pnpm is the workspace/package manager (pnpm-workspace.yaml +
      # packageManager pin in package.json); Node executes the TS toolchain
      # bins (tsc, eslint, vitest) and the daemon runtime.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install SwiftFormat and SwiftLint
        run: brew install swiftformat swiftlint

      - name: Tool versions
        run: |
          swiftformat --version
          swiftlint version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck + eslint (type-aware) + swift build/test/format-lint, then vitest
      - name: Verify
        run: pnpm verify
